name: autmatizar pruebas

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validacion:
    name: validar proyecto
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: db_user_springboot
          MYSQL_USER: testuser
          MYSQL_PASSWORD: luis1234
          MYSQL_ROOT_PASSWORD: luis1234 
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: clonar repositorio
        uses: actions/checkout@v4

      - name: configurar JDK de java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: dar permisos de ejecucion
        run: chmod +x mvnw

      - name: ejecutar pruebas y validacion de codigo
        run: ./mvnw clean verify