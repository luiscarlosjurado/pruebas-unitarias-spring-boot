name: autmatizar pruebas

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validacion:
    name: validar proyecto
    runs-on: ubuntu-latest

    steps:
      - name: clonar repositorio
        uses: actions/checkout@v4

      - name: configurar JDK de java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: dar permisos de ejecucion
        run: chmod +x mvnw

      - name: ejecutar pruebas y validacion de codigo
        run: ./mvnw clean verify
